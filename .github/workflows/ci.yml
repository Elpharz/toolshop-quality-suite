name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Typecheck, lint, format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run check

  test:
    name: Playwright (API + UI, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Public Toolshop demo. Override with repository variables/secrets to target another instance.
      BASE_URL: ${{ vars.BASE_URL || 'https://practicesoftwaretesting.com' }}
      API_URL: ${{ vars.API_URL || 'https://api.practicesoftwaretesting.com' }}
      CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL || 'customer@practicesoftwaretesting.com' }}
      CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD || 'welcome01' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run tests
        run: npx playwright test
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload JUnit + traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 14
